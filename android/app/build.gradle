plugins {
    id "com.android.application"
}

android {
    namespace "com.nev.locator"
    compileSdk 34

    defaultConfig {
        applicationId "com.nev.locator"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
